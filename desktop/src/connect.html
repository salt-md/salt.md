<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>Salt.md</title>
<style>
  /* Follows the system theme, because this page is the first thing anybody
     sees and a white flash into a dark workspace is a poor greeting. */
  :root {
    --bg: #ffffff; --fg: #37352f; --muted: #787774;
    --border: #e9e7e4; --accent: #2f7d4f; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --fg: #d4d4d4; --muted: #8f8f8f;
      --border: #2f2f2f; --accent: #4fa872; --card: #242424;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* Leaves room for the traffic lights, which sit inside the window. */
    padding-top: 28px;
    -webkit-user-select: none; user-select: none;
    /* The whole background drags the window — there is no title bar to grab. */
    -webkit-app-region: drag;
  }
  .card { width: 380px; max-width: calc(100vw - 48px); text-align: center; -webkit-app-region: no-drag; }
  .mark { font-size: 40px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
  input {
    width: 100%; padding: 11px 13px; font: inherit; font-size: 14px;
    color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 10px; padding: 11px 13px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 34px; color: var(--muted); }
  .msg.bad { color: #c4554d; }
  .hint { margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🧂</div>
    <h1>Connect to your Salt.md</h1>
    <p class="sub">This app is a window onto a server you run.<br>Your data stays there.</p>

    <input id="url" type="text" placeholder="salt.example.com" autocomplete="off" spellcheck="false" autofocus>
    <button id="go">Connect</button>
    <div class="msg" id="msg"></div>

    <p class="hint">
      No server yet? Salt.md is one binary you run yourself —<br>
      see <code>salt.md</code> for how to start one.
    </p>
  </div>

<script>
  const $url = document.getElementById('url');
  const $go = document.getElementById('go');
  const $msg = document.getElementById('msg');

  const say = (text, bad = false) => {
    $msg.textContent = text;
    $msg.className = 'msg' + (bad ? ' bad' : '');
  };

  // Arriving here from a failed load rather than from the menu: say what
  // happened instead of showing an empty form that looks like a fresh start.
  const params = new URLSearchParams(location.search);
  if (params.get('error')) {
    const target = params.get('url') || '';
    say('Could not reach ' + (target ? new URL(target).origin : 'the server') + '. Is it running?', true);
  }

  // Prefill whatever is configured, so "Change server" is an edit and not
  // retyping an address from memory.
  window.salt.getServer().then((s) => { if (s) $url.value = s; });

  const connect = async () => {
    const value = $url.value.trim();
    if (!value) return;
    $go.disabled = true;
    say('Looking for a Salt.md there…');
    const res = await window.salt.setServer(value);
    if (res.ok) {
      say('Found it. Opening…');
      return; // the main process navigates the window
    }
    $go.disabled = false;
    if (res.error === 'not-a-url') say('That does not look like an address.', true);
    else if (res.error === 'not-salt') say('Something answered there, but it is not a Salt.md.', true);
    else say('Nothing answered there. Check the address, and that the server is running.', true);
  };

  $go.addEventListener('click', connect);
  $url.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
